<!DOCTYPE html>

    <style>
        body {

            background-color: #f4f7f6; 
            color: #333; 
            margin: 0; 
            padding: 20px; 
        }
        .profile-container { 
            max-width: 650px; 
            margin: 40px auto; 
            background: #fff; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.1); 
        }
        .header { 
            text-align: center; 
            border-bottom: 2px solid #f0f0f0; 
            padding-bottom: 20px; 
            margin-bottom: 20px; 
        }
        .avatar { 
            width: 150px; 
            height: 150px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 4px solid #007bff; 
            margin-bottom: 15px;
        }
        h1 { 
            margin: 0 0 5px; 
            color: #222; 
        }
        .role { 
            color: #666; 
            font-size: 1.1em; 
            margin: 5px 0; 
        }
        .section-title { 
            color: #007bff; 
            border-bottom: 2px solid #e0eaf5; 
            padding-bottom: 8px; 
            margin-top: 25px; 
            font-size: 1.3em;
        }
        ul { 
            line-height: 1.8; 
            list-style-type: none;
            padding-left: 0;
        }
        li {
            background: #f9f9f9;
            margin-bottom: 8px;
            padding: 10px 15px;
            border-radius: 6px;
            border-left: 4px solid #007bff;
        }
        .back-btn { 
            display: inline-block; 
            margin-top: 30px; 
            padding: 12px 24px; 
            background: #007bff; 
            color: #fff; 
            text-decoration: none; 
            border-radius: 6px;
            transition: background 0.3s;
        }
        .back-btn:hover {
            background: #0056b3;
        }
    </style>
</head>
