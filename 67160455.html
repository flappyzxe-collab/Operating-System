<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ekkrit Powat</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    height: 100vh;
    background: url('images/455Banner.jpg') no-repeat center/cover;;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* ================= CONTAINER ================= */
.container {
    width: 900px;
    height: 550px;
    background: #fff;
    border-radius: 20px;
    display: flex;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
}

/* ================= LEFT ================= */
.left {
    width: 50%;
    position: relative;
    overflow: hidden;
    color: white;
}

/* 🔥 FIX รูไม่ระเบิด */
.bg-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
}

/* overlay ดำจางๆ (ทำให้ text อ่านง่ายขึ้น) */
.left::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.25);
    z-index: 2;
}

.left-content {
    position: relative;
    z-index: 3;
    padding: 30px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

/* top */
.top-links {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.top-links button {
    background: transparent;
    border: 1px solid #fff;
    padding: 6px 14px;
    border-radius: 20px;
    color: #fff;
    cursor: pointer;
    transition: 0.2s;
}

.top-links button:hover {
    background: rgba(255,255,255,0.2);
}

/* user */
.user-info {
    display: flex;
    align-items: center;
    gap: 10px;
}

.user-info img {
    width: 40px;
    border-radius: 50%;
}

/* ================= RIGHT ================= */
.right {
    width: 50%;
    padding: 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

/* text spacing */
.logo {
    font-weight: 600;
    margin-bottom: 10px;
}

h2 {
    margin-bottom: 5px;
}

.subtitle {
    margin-bottom: 15px;
}

/* fake input */
.fake-input {
    width: 100%;
    height: 45px;
    padding: 0 12px;
    display: flex;
    align-items: center;
    border-radius: 10px;
    border: 1px solid #ddd;
    margin-bottom: 10px;
    cursor: pointer;
    transition: 0.2s;
}

.fake-input:hover {
    border-color: #ff5e00;
}

/* button */
.login-btn {
    width: 100%;
    height: 45px;
    border: none;
    border-radius: 25px;
    background: #ff5e00;
    color: white;
    cursor: pointer;
    margin-top: 10px;
    transition: 0.2s;
}

.login-btn:hover {
    background: #e65300;
}

/* footer */
.signup {
    margin-top: 15px;
    font-size: 13px;
    text-align: center;
}

.signup a {
    color: #ff5e00;
    text-decoration: none;
}

/* ================= RESPONSIVE ================= */
@media(max-width: 768px){
    .container {
        flex-direction: column;
        width: 90%;
        height: auto;
    }

    .left {
        height: 200px;
        width: 100%;
    }

    .right {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- LEFT -->
    <div class="left">
        <img src="images/455.jpg" class="bg-img">

        <div class="left-content">
            <div class="top-links">
                <span>Software Engineering</span>
                <button onclick="window.open('https://www.informatics.buu.ac.th/2020/?page_id=181','_blank')">
                    Join Us
                </button>
            </div>

            <div class="user-info">
                <img src="images/455MiniProfile.jpg">
                <div>
                    <strong>Hu Tao</strong><br>
                    <small>Genshin Impact</small>
                </div>
            </div>
        </div>
    </div>

    <!-- RIGHT -->
    <div class="right">
        <div class="logo">Cluster 0</div>

        <h2>Ekkrit Powat # 67160455</h2>
        <p class="subtitle">Development Engineer</p>

        <small>Email</small>
        <div class="fake-input" onclick="copyText(this)">
            gun.ekkrit@email.com
        </div>

        <small>Phone</small>
        <div class="fake-input" onclick="copyText(this)">
            +66622319919
        </div>

        <small>Birth Date</small>
        <div class="fake-input">
            3 September 2005
        </div>

        <button class="login-btn" onclick="window.open('https://github.com/ShirokamiUtsuro','_blank')">
            Github
        </button>

        <div class="signup">
            Facebook Contact
            <a href="https://www.facebook.com/gunfriendGamesisreal" target="_blank">
                Click Me!
            </a>
        </div>
    </div>

</div>

<script>
function copyText(el) {
    const text = el.innerText;

    navigator.clipboard.writeText(text)
        .then(() => {
            alert("Copied: " + text);
        })
        .catch(err => {
            console.error("Copy failed", err);
        });
}
</script>
