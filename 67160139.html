<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mini Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --card: #131316;
      --border: #2a2a30;
      --accent: #c8a96e;
      --accent2: #e8d5a3;
      --text: #f0ece4;
      --muted: #7a7670;
      --tag-bg: #1e1d1a;
    }

    body {
      background: #232323;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    #grid-bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-color: #0a0a0a;
      background-image:
      linear-gradient(rgba(255,255,255,0.042) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.042) 1px, transparent 1px);
      background-size: 36px 36px;
    }

    #bubble-canvas {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 430px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) both;
      box-shadow: 0 24px 60px rgba(0,0,0,0.55), 0 0 0 1px rgba(200,169,110,0.08);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-top {
      height: 110px;
      background: linear-gradient(135deg, #1a1710 0%, #221f18 60%, #1a1710 100%);
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    .card-top::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 8px,
        rgba(200,169,110,0.025) 8px,
        rgba(200,169,110,0.025) 9px
      );
    }

    .avatar-wrap {
      position: absolute;
      bottom: -38px;
      left: 28px;
      z-index: 3;
    }

    .avatar {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background: url('images/139.JPG') center/cover no-repeat;
      border: 3px solid var(--card);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-size: 30px;
      color: #0d0d0f;
      letter-spacing: -1px;
      box-shadow: 0 4px 24px rgba(200,169,110,0.35);

    }

    .id-badge {
      position: absolute;
      top: 14px;
      right: 18px;
      background: rgba(200,169,110,0.15);
      border: 1px solid rgba(200,169,110,0.3);
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 10px;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 1.2px;
      text-transform: uppercase;
      z-index: 3;
      backdrop-filter: blur(4px);
    }

    .card-body {
      padding: 54px 28px 28px;
    }

    .name-block { margin-bottom: 18px; }

    .full-name {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      color: var(--text);
      line-height: 1.2;
    }

    .nickname-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .nickname {
      font-size: 12px;
      font-weight: 500;
      color: var(--accent);
      background: rgba(200,169,110,0.1);
      border: 1px solid rgba(200,169,110,0.2);
      border-radius: 20px;
      padding: 2px 11px;
    }

    .dept-tag {
      font-size: 12px;
      color: var(--muted);
      font-weight: 400;
    }

    .sep { color: var(--border); font-size: 12px; }

    .position {
      font-size: 12px;
      color: var(--muted);
      font-weight: 300;
    }

    .divider {
      height: 1px;
      background: linear-gradient(to right, var(--border), transparent);
      margin: 20px 0;
    }

    .info-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .info-row {
      display: flex;
      align-items: center;
      gap: 14px;
      animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) both;
    }

    .info-row:nth-child(1) { animation-delay: 0.15s; }
    .info-row:nth-child(2) { animation-delay: 0.22s; }
    .info-row:nth-child(3) { animation-delay: 0.29s; }
    .info-row:nth-child(4) { animation-delay: 0.36s; }

    .icon {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: var(--tag-bg);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon svg {
      width: 16px;
      height: 16px;
      stroke: var(--accent);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .info-label {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .info-value {
      font-size: 14px;
      color: var(--text);
      font-weight: 400;
    }

    .info-value a {
      color: var(--accent2);
      text-decoration: none;
      transition: color 0.2s;
    }

    .info-value a:hover { color: var(--accent); }

    .card-footer {
      padding: 16px 28px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-dot {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #4caf82;
      box-shadow: 0 0 6px rgba(76,175,130,0.6);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .dept-footer {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.6px;
    }
  </style>
</head>
<body>
    <button onclick="history.back()" style="

<!-- Page background mesh -->
<div id="grid-bg"></div>

<div class="card">

  <div class="card-top">
    <div class="id-badge">ID · 67160139</div>

  </div>

  <div class="card-body">

    <div class="name-block">
      <div class="full-name">Thirapat Paton</div>
      <div class="nickname-row">
        <span class="nickname">กีต้า</span>
        <span class="sep">·</span>

      </div>
    </div>

    <div class="divider"></div>

    <div class="info-list">

      <div class="info-row">
        <div class="icon">
          <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,4 12,13 22,4"/></svg>
        </div>
        <div>
          <div class="info-label">Email</div>
          <div class="info-value"><a href="mailto:67160139@go.buu.ac.th">67160139@go.buu.ac.th</a></div>
        </div>
      </div>

      <div class="info-row">
        <div class="icon">
          <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.8 19.8 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.8 19.8 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.12.96.36 1.9.72 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.9.36 1.85.6 2.81.72A2 2 0 0122 16.92z"/></svg>

        <div>

      <div class="info-row">
        <div class="icon">
          <svg viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 00-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0020 4.77 5.07 5.07 0 0019.91 1S18.73.65 16 2.48a13.38 13.38 0 00-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 005 4.77a5.44 5.44 0 00-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 009 18.13V22"/></svg>

<script>
const canvas = document.getElementById('bubble-canvas');
const ctx    = canvas.getContext('2d');

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

function makeBubble(fromBottom) {
  const r = 40 + Math.random() * 110;
  const useGold = Math.random() < 0.55;
  return {
    x:     Math.random() * window.innerWidth,
    y:     fromBottom ? window.innerHeight + r : Math.random() * window.innerHeight,
    r,
    speed:  0.15 + Math.random() * 0.28,
    drift:  (Math.random() - 0.5) * 0.35,
    alpha:  0.04 + Math.random() * 0.06,
    color:  useGold
              ? [185 + Math.random()*35|0, 148 + Math.random()*28|0, 50 + Math.random()*28|0]
              : [80  + Math.random()*35|0, 76  + Math.random()*25|0, 62 + Math.random()*18|0],
    wobble:      Math.random() * Math.PI * 2,
    wobbleSpeed: 0.003 + Math.random() * 0.005,
  };
}

const bubbles = Array.from({ length: 20 }, () => makeBubble(false));

function drawBubble(b) {
  const [r, g, bl] = b.color;
  const grd = ctx.createRadialGradient(
    b.x - b.r * 0.28, b.y - b.r * 0.28, b.r * 0.04,
    b.x, b.y, b.r
  );
  grd.addColorStop(0,   `rgba(${r},${g},${bl},${(b.alpha * 1.9).toFixed(3)})`);
  grd.addColorStop(0.5, `rgba(${r},${g},${bl},${b.alpha.toFixed(3)})`);
  grd.addColorStop(1,   `rgba(${r},${g},${bl},0)`);

  ctx.beginPath();
  ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
  ctx.fillStyle = grd;
  ctx.fill();

  // rim
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(${r},${g},${bl},${(b.alpha * 0.55).toFixed(3)})`;
  ctx.lineWidth = 0.7;
  ctx.stroke();
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  bubbles.forEach((b, i) => {
    b.wobble += b.wobbleSpeed;
    b.x += b.drift + Math.sin(b.wobble) * 0.28;
    b.y -= b.speed;

    if (b.y + b.r < 0) {
      bubbles[i] = makeBubble(true);
      bubbles[i].x = Math.random() * canvas.width;
    }

    drawBubble(b);
  });

  requestAnimationFrame(animate);
}
animate();
</script>
</body>
